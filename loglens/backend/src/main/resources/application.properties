spring.application.name=loglens-backend
server.port=8080

# LogLens settings. Raising max-upload-bytes also raises the Spring multipart limit below.
loglens.max-upload-bytes=10485760
loglens.allowed-extensions=log,txt
loglens.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Spring-level multipart guard (LogLens validates size itself as well)
spring.servlet.multipart.max-file-size=${loglens.max-upload-bytes}B
spring.servlet.multipart.max-request-size=-1

# Never leak internal details in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
